<text x="589" y="43.0"><tspan fill="#f3d27a" xml:space="preserve">stagehand</tspan><tspan fill="#9c7b77" xml:space="preserve">@</tspan><tspan fill="#f3e7d8" xml:space="preserve">hackprinceton</tspan></text>
<text x="589" y="60.0"><tspan fill="#9c7b77" xml:space="preserve">----------------------------------</tspan></text>
<text x="589" y="77.0"><tspan fill="#d9a3a8" xml:space="preserve">Tagline       </tspan><tspan fill="#f3e7d8" xml:space="preserve">hear and see a room before you book it</tspan></text>
<text x="589" y="94.0"><tspan fill="#d9a3a8" xml:space="preserve">For           </tspan><tspan fill="#f3e7d8" xml:space="preserve">singers, actors and film crews</tspan></text>
<text x="589" y="111.0"><tspan fill="#d9a3a8" xml:space="preserve">Host          </tspan><tspan fill="#f3e7d8" xml:space="preserve">HackPrinceton, Fall 2026</tspan></text>
<text x="589" y="128.0"><tspan fill="#d9a3a8" xml:space="preserve">Uptime        </tspan><tspan fill="#f3e7d8" xml:space="preserve">36 hours</tspan></text>
<text x="589" y="162.0"><tspan fill="#d9a3a8" xml:space="preserve">Data.Inside   </tspan><tspan fill="#f3e7d8" xml:space="preserve">Matterport, 2,986 room views</tspan></text>
<text x="589" y="179.0"><tspan fill="#d9a3a8" xml:space="preserve">Data.Record   </tspan><tspan fill="#f3e7d8" xml:space="preserve">CoStar, 3,288 properties</tspan></text>
<text x="589" y="196.0"><tspan fill="#d9a3a8" xml:space="preserve">Data.Above    </tspan><tspan fill="#f3e7d8" xml:space="preserve">Vexcel aerials and footprints</tspan></text>
<text x="589" y="213.0"><tspan fill="#d9a3a8" xml:space="preserve">Data.Around   </tspan><tspan fill="#f3e7d8" xml:space="preserve">OpenStreetMap building heights</tspan></text>
<text x="589" y="247.0"><tspan fill="#d9a3a8" xml:space="preserve">Kernel        </tspan><tspan fill="#f3e7d8" xml:space="preserve">Eyring T60, 6 octave bands</tspan></text>
<text x="589" y="264.0"><tspan fill="#d9a3a8" xml:space="preserve">Wave          </tspan><tspan fill="#f3e7d8" xml:space="preserve">2D FDTD over the floor plan</tspan></text>
<text x="589" y="281.0"><tspan fill="#d9a3a8" xml:space="preserve">Seat          </tspan><tspan fill="#f3e7d8" xml:space="preserve">image sources + HRTF, 3rd order</tspan></text>
<text x="589" y="298.0"><tspan fill="#d9a3a8" xml:space="preserve">Clap          </tspan><tspan fill="#f3e7d8" xml:space="preserve">ISO 3382, Schroeder + Lundeby</tspan></text>
<text x="589" y="315.0"><tspan fill="#d9a3a8" xml:space="preserve">Agent         </tspan><tspan fill="#f3e7d8" xml:space="preserve">LangChain Deep Agents, 2 subagents</tspan></text>
<text x="589" y="332.0"><tspan fill="#d9a3a8" xml:space="preserve">Money         </tspan><tspan fill="#f3e7d8" xml:space="preserve">Capital One Nessie</tspan></text>
<text x="589" y="349.0"><tspan fill="#d9a3a8" xml:space="preserve">Voice         </tspan><tspan fill="#f3e7d8" xml:space="preserve">Photon 2.0, iMessage and phone</tspan></text>
<text x="589" y="383.0"><tspan fill="#f3d27a" xml:space="preserve">Checked blind against</tspan></text>
<text x="589" y="400.0"><tspan fill="#d9a3a8" xml:space="preserve">Concertgebouw   </tspan><tspan fill="#f3e7d8" xml:space="preserve">1.96s</tspan><tspan fill="#9c7b77" xml:space="preserve"> vs </tspan><tspan fill="#f3e7d8" xml:space="preserve">2.0s</tspan><tspan fill="#f3e7d8" xml:space="preserve">  </tspan><tspan fill="#bcd3a2" xml:space="preserve">-2.1%</tspan></text>
